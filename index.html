<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗記カード（地理・生物基礎・情報）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7DFE6; --surface:#EEF2F5; --text:#1F2A36; --sub:#5C6875;
  --card:#FFFFFF; --card-ink:#1F2A36; --card-sub:#7A8591; --red:#D6141C;
  --ring:#9EA8B2; --line:#C3CDD6; --chip-on:#1F2A36; --chip-on-text:#FFFFFF;
  --ok:#1E7A4C; --edge:#E9EDF0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A20; --surface:#222A33; --text:#E4E9EE; --sub:#9AA6B2;
    --card:#ECEEEA; --card-ink:#1F2A36; --card-sub:#6E7884; --red:#C4121A;
    --ring:#7D8791; --line:#36414C; --chip-on:#E4E9EE; --chip-on-text:#151A20;
    --ok:#4FBF86; --edge:#C9CDC6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A20; --surface:#222A33; --text:#E4E9EE; --sub:#9AA6B2;
  --card:#ECEEEA; --card-ink:#1F2A36; --card-sub:#6E7884; --red:#C4121A;
  --ring:#7D8791; --line:#36414C; --chip-on:#E4E9EE; --chip-on-text:#151A20;
  --ok:#4FBF86; --edge:#C9CDC6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px 14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:4px 0 10px;letter-spacing:.02em}
.known{font-size:13px;color:var(--sub);white-space:nowrap}
.known b{color:var(--ok);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text);border-color:var(--chip-on)}
.opts{display:flex;gap:6px;margin:4px 0 0}
.opt{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;
  font-size:13px;padding:8px 6px;border-radius:10px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--text);font-weight:700}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 4px 8px;min-height:0}
.deck{position:relative;width:100%;max-width:440px;aspect-ratio:1.55/1;max-height:100%;perspective:1400px;touch-action:pan-y}
.deck::before,.deck::after{content:"";position:absolute;inset:0;background:var(--edge);border-radius:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.12)}
.deck::before{transform:translate(6px,7px) rotate(1.4deg)}
.deck::after{transform:translate(3px,3px) rotate(-.8deg)}
.deck.empty::before,.deck.empty::after{display:none}
.card{position:absolute;inset:0;z-index:1;cursor:pointer;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);color:var(--card-ink);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.14);
  display:flex;flex-direction:column;padding:18px 22px 16px 54px;overflow:hidden}
.back{transform:rotateY(180deg)}
.tag{font-size:12px;color:var(--card-sub);display:flex;justify-content:space-between}
.tag .mark{color:var(--ok);font-weight:700}
.q{flex:1;display:flex;align-items:center;font-size:clamp(17px,4.8vw,21px);line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.small-q{font-size:13px;color:var(--card-sub);line-height:1.45;margin-top:6px}
.a{flex:1;display:flex;align-items:center;font-family:"Klee One","Zen Kaku Gothic New",cursive;font-weight:600;
  color:var(--red);font-size:clamp(20px,6vw,28px);line-height:1.4;overflow-wrap:anywhere}
.hint{font-size:11px;color:var(--card-sub);text-align:right}
/* ring hole + metal ring, fixed while card flips */
.hole{position:absolute;z-index:3;left:16px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.ring{position:absolute;z-index:4;left:6px;top:50%;width:28px;height:44px;margin-top:-22px;border-radius:50%;
  border:3px solid var(--ring);border-right-color:transparent;transform:rotate(-8deg);pointer-events:none}
.empty-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;color:var(--sub);font-size:15px;padding:20px}
.empty-msg button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  padding:8px 14px;border-radius:10px;cursor:pointer}
.count{text-align:center;font-size:13px;color:var(--sub);margin:6px 0 10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.controls{display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:8px}
.controls button{font:inherit;font-size:15px;border-radius:12px;padding:12px 6px;cursor:pointer;border:1px solid var(--line);
  background:var(--surface);color:var(--text)}
.controls .got{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.controls .again{font-weight:700}
button:focus-visible,.card:focus-visible{outline:3px solid #3A7BD5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
@media (min-height:760px){.stage{padding-top:28px}}
</style>
<style>
.subjects{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 10px}
.subj{font:inherit;font-size:14px;padding:9px 6px;border:0;background:var(--surface);color:var(--text);cursor:pointer}
.subj[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text);font-weight:700}
.subj small{display:block;font-size:11px;opacity:.75;font-weight:400}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="h1">暗記カード</h1>
    <div class="known">覚えた <b id="knownNum">0</b>/<span id="totalNum">0</span></div>
  </header>
  <div class="subjects" role="group" aria-label="科目を選ぶ"><button class="subj" data-s="chiri">地理<small>民族と宗教</small></button><button class="subj" data-s="bio">生物基礎<small>体内環境の維持</small></button><button class="subj" data-s="joho">情報<small>デジタル・コンピュータ</small></button></div>
  <div class="chips" id="chips" role="group" aria-label="プリントを選ぶ"></div>
  <div class="opts">
    <button class="opt" id="onlyLeft" aria-pressed="false">まだのカードだけ</button>
    <button class="opt" id="shuffle" aria-pressed="false">シャッフル</button>
    <button class="opt" id="reverse" aria-pressed="false">答え→問題</button>
  </div>

  <div class="stage">
    <div class="deck" id="deck">
      <div class="card" id="card" tabindex="0" role="button" aria-label="タップでめくる">
        <div class="face front">
          <div class="tag"><span id="fTag"></span><span class="mark" id="fMark"></span></div>
          <div class="q" id="fText"></div>
          <div class="hint">タップでめくる</div>
        </div>
        <div class="face back">
          <div class="tag"><span id="bTag"></span><span class="mark" id="bMark"></span></div>
          <div class="small-q" id="bSmall"></div>
          <div class="a" id="bText"></div>
        </div>
      </div>
      <div class="hole"></div><div class="ring"></div>
      <div class="empty-msg" id="emptyMsg" hidden>
        <div>このプリントのカードは全部覚えました。</div>
        <button id="showAll">すべてのカードを表示</button>
      </div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="controls">
    <button id="prev" aria-label="前のカード">←</button>
    <button class="again" id="again">まだ</button>
    <button class="got" id="got">覚えた</button>
    <button id="next" aria-label="次のカード">→</button>
  </div>
</div>

const $=id=>document.getElementById(id);
const card=$("card");
let subj="chiri";
try{const s=localStorage.getItem("cards-subject");if(s&&SUBJECTS[s])subj=s;}catch(e){}
let CARDS=[],known=new Set(),state={},list=[],idx=0;
function S(){return SUBJECTS[subj]}
function load(){
  const sb=S();
  CARDS=[];Object.keys(sb.raw).forEach(p=>sb.raw[p].forEach((c,i)=>CARDS.push({id:p+"-"+i,p:+p,q:c[0],a:c[1]})));
  known=new Set();state={print:"all",onlyLeft:false,shuffle:false,reverse:false};
  try{const s=JSON.parse(localStorage.getItem(sb.key)||"null");if(s){known=new Set(s.known||[]);Object.assign(state,s.state||{});}}catch(e){}
  if(state.print!=="all"&&!sb.raw[state.print])state.print="all";
}
function save(){try{localStorage.setItem(S().key,JSON.stringify({known:[...known],state}));localStorage.setItem("cards-subject",subj);}catch(e){}}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function scopeCards(){return CARDS.filter(c=>state.print==="all"||c.p===+state.print)}
function build(){
  let l=scopeCards();
  if(state.onlyLeft)l=l.filter(c=>!known.has(c.id));
  if(state.shuffle)l=shuffleArr(l.slice());
  list=l;idx=0;render();
}
function render(){
  card.classList.remove("flipped");
  const empty=list.length===0;
  $("emptyMsg").hidden=!empty;card.hidden=empty;$("deck").classList.toggle("empty",empty);
  const scope=scopeCards(),kn=scope.filter(c=>known.has(c.id)).length;
  $("knownNum").textContent=kn;$("totalNum").textContent=scope.length;
  $("barFill").style.width=(scope.length?kn/scope.length*100:0)+"%";
  $("count").textContent=empty?"":(idx+1)+" / "+list.length+" 枚";
  ["prev","next","again","got"].forEach(b=>$(b).disabled=empty);
  if(empty)return;
  const c=list[idx],sb=S(),tag=sb.prefix+c.p+"　"+sb.titles[c.p],m=known.has(c.id)?"✓ 覚えた":"";
  const front=state.reverse?c.a:c.q,back=state.reverse?c.q:c.a;
  $("fTag").textContent=tag;$("bTag").textContent=tag;$("fMark").textContent=m;$("bMark").textContent=m;
  $("fText").textContent=front;$("bSmall").textContent=front;$("bText").textContent=back;
  $("fText").style.fontFamily=state.reverse?'"Klee One","Zen Kaku Gothic New",cursive':"";
  $("fText").style.color=state.reverse?"var(--red)":"";
}
function flip(){if(list.length)card.classList.toggle("flipped")}
function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;render()}
function mark(ok){
  if(!list.length)return;const c=list[idx];
  ok?known.add(c.id):known.delete(c.id);save();
  if(state.onlyLeft&&ok){list.splice(idx,1);if(idx>=list.length)idx=0;render();}else go(1);
}
const chips=$("chips");
function buildChips(){
  chips.innerHTML="";const sb=S();
  [["all","すべて"],...Object.keys(sb.raw).map(p=>[p,sb.prefix+p])].forEach(([v,l])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=l;b.dataset.v=v;
    b.onclick=()=>{state.print=v;save();syncUI();build();};chips.appendChild(b);
  });
  chips.scrollLeft=0;
}
function syncUI(){
  document.querySelectorAll(".subj").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===subj)));
  chips.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(state.print))));
  $("onlyLeft").setAttribute("aria-pressed",state.onlyLeft);
  $("shuffle").setAttribute("aria-pressed",state.shuffle);
  $("reverse").setAttribute("aria-pressed",state.reverse);
  document.title=S().name+"｜暗記カード";
}
function switchTo(s){subj=s;load();save();buildChips();syncUI();build();}
document.querySelectorAll(".subj").forEach(b=>b.onclick=()=>{if(b.dataset.s!==subj)switchTo(b.dataset.s)});
$("onlyLeft").onclick=()=>{state.onlyLeft=!state.onlyLeft;save();syncUI();build();};
$("shuffle").onclick=()=>{state.shuffle=!state.shuffle;save();syncUI();build();};
$("reverse").onclick=()=>{state.reverse=!state.reverse;save();syncUI();render();};
$("showAll").onclick=()=>{state.onlyLeft=false;save();syncUI();build();};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
